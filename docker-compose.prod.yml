# Postiz en producción (stack de Portainer). Mismo esquema que siux.co / siux.studio:
# Portainer solo descarga imágenes ya construidas, no buildea acá. Las variables se
# cargan en Portainer (ver .env.prod.example); las obligatorias cortan el deploy si faltan.
#
# Un solo contenedor: Redis y Temporal corren embebidos en la imagen (Dockerfile.siux);
# Temporal guarda su base SQLite en el volumen /config. Postgres y MinIO son los que ya
# corren en el servidor y se alcanzan por la red SHARED_NETWORK; las redes sociales bajan los archivos
# de MINIO_PUBLIC_URL. Requiere la imagen del fork siuxco/postiz-app, que agrega
# CLOUDFLARE_ENDPOINT para usar un S3 compatible en lugar de R2.
services:
  postiz:
    # Imagen del fork (la construye .github/workflows/siux-build.yaml). La oficial de
    # gitroomhq no sirve con MinIO: no tiene CLOUDFLARE_ENDPOINT.
    image: ${POSTIZ_IMAGE:-ghcr.io/siuxco/postiz-app:latest}
    container_name: postiz
    restart: unless-stopped
    ports:
      # El proxy (Nginx Proxy Manager / Cloudflare) apunta a este puerto con TLS.
      - '${POSTIZ_PORT:-5000}:5000'
    environment:
      # === Requeridas
      - MAIN_URL=${POSTIZ_URL:?Definí POSTIZ_URL, ej. https://postiz.siux.co}
      - FRONTEND_URL=${POSTIZ_URL}
      - NEXT_PUBLIC_BACKEND_URL=${POSTIZ_URL}/api
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET (openssl rand -hex 32)}
      # Postgres del servidor: base y usuario propios de Postiz. Prisma crea las tablas al arrancar.
      - DATABASE_URL=${DATABASE_URL:?Definí DATABASE_URL, ej. postgresql://postiz:clave@postgres:5432/postiz}
      # Redis y Temporal corren embebidos en la imagen. REDIS_URL / TEMPORAL_ADDRESS solo
      # hacen falta para usar unos externos (ej. redis://redis:6379/3).
      - REDIS_URL=${REDIS_URL:-}
      - BACKEND_INTERNAL_URL=http://localhost:3000
      - IS_GENERAL=true
      # Arranca missingPostWorkflow: cada hora relanza los posts en QUEUE de las últimas
      # 48 h que no tengan workflow en Temporal (ej. si se perdió temporal.db).
      - RUN_CRON=true
      # Con la base vacía Postiz deja crear el primer usuario aunque esté en true;
      # después nadie más puede registrarse.
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-true}

      # === Archivos subidos → MinIO (proveedor "cloudflare" de Postiz apuntado a MinIO)
      - STORAGE_PROVIDER=cloudflare
      # MINIO_ENDPOINT/MINIO_PORT: MinIO por la red interna, sin SSL (como tarotia).
      # MINIO_USE_SSL no se lee: la conexión interna es siempre http.
      - CLOUDFLARE_ENDPOINT=http://${MINIO_ENDPOINT:?Definí MINIO_ENDPOINT, ej. minio}:${MINIO_PORT:-9000}
      # URL pública https de la API de MinIO (proxy → MinIO:9000). El navegador sube los
      # videos directo ahí con URLs firmadas para ese host.
      - CLOUDFLARE_PUBLIC_ENDPOINT=${MINIO_PUBLIC_URL:?Definí MINIO_PUBLIC_URL, ej. https://s3.sv00.siux.co}
      - CLOUDFLARE_ACCESS_KEY=${MINIO_ACCESS_KEY:?Definí MINIO_ACCESS_KEY}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:?Definí MINIO_SECRET_KEY}
      - CLOUDFLARE_BUCKETNAME=${MINIO_BUCKET_NAME:-postiz}
      # Carpeta dentro del bucket (ej. postiz/ para compartir el de tarotia). Vacío = raíz.
      - CLOUDFLARE_KEY_PREFIX=${MINIO_KEY_PREFIX:-}
      # URL pública del bucket (lectura anónima): desde acá las redes bajan los archivos.
      # MINIO_BUCKET_URL la reemplaza cuando un proxy ya apunta al bucket (cdn.tarotia.app).
      - CLOUDFLARE_BUCKET_URL=${MINIO_BUCKET_URL:-${MINIO_PUBLIC_URL}/${MINIO_BUCKET_NAME:-postiz}}
      - CLOUDFLARE_REGION=${MINIO_REGION:-us-east-1}
      # Solo se usa para armar el endpoint de R2; con CLOUDFLARE_ENDPOINT no importa.
      - CLOUDFLARE_ACCOUNT_ID=minio
      # Sin esto el uploader achica las imágenes a 1000px y salen pixeladas en Instagram.
      - DISABLE_IMAGE_COMPRESSION=true

      # === Redes (cada app de desarrollador registra ${POSTIZ_URL}/integrations/social/<red>)
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - TIKTOK_CLIENT_ID=${TIKTOK_CLIENT_ID:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - THREADS_APP_ID=${THREADS_APP_ID:-}
      - THREADS_APP_SECRET=${THREADS_APP_SECRET:-}
      - X_API_KEY=${X_API_KEY:-}
      - X_API_SECRET=${X_API_SECRET:-}

      # === Email (opcional; sin proveedor no hay recuperación de contraseña)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-}

      - API_LIMIT=30
      - NX_ADD_PLUGINS=false
    volumes:
      - postiz-config:/config
    networks:
      - shared-network
    healthcheck:
      # La imagen no trae curl ni wget; Node 22 tiene fetch.
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  # Config de Postiz y la base de Temporal (temporal.db): sin esto se pierden los posts programados.
  postiz-config:

networks:
  # Red existente donde están Postgres y MinIO (la misma que usa tarotia.app).
  shared-network:
    external: true
    name: ${SHARED_NETWORK:-backend_net}
