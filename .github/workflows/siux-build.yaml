name: Siux Build

# Igual que siux.co / siux.studio: al pushear un tag de versión (o a mano) construye
# la imagen, la sube a GHCR del repo y avisa a Portainer para que redeploye.
# Corre en el fork siuxco/postiz-app (en gitroomhq/postiz-app no corre). La imagen trae
# el soporte de MinIO (CLOUDFLARE_ENDPOINT) y un Temporal embebido que la oficial no
# tiene; ver DEPLOY-PRODUCCION.md.
# En el fork: deshabilitar "Build Containers" (build-containers.yml) en la pestaña Actions,
# porque también corre con cada tag y falla al intentar pushear a ghcr.io/gitroomhq.

on:
  workflow_dispatch: {}
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.repository != 'gitroomhq/postiz-app' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base: la imagen de Postiz tal cual (Dockerfile.dev, igual que upstream).
      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}:base-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Final: base + Temporal embebido (Dockerfile.siux).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.siux
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:base-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Trigger Portainer Webhook
        if: success() && vars.PORTAINER_WEBHOOK != ''
        run: |
          curl -X POST "${{ vars.PORTAINER_WEBHOOK }}"
